<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>To-Do App (Figma style)</title>
    <!-- Подключаем скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ОСНОВНЫЕ ЦВЕТА ИЗ МАКЕТА */
        :root {
            --bg-color: #1a1a1a;        /* Глубокий черный фон */
            --card-bg: #2d2d2d;         /* Чуть светлее для карточек/ввода */
            --accent-color: #9b51e0;    /* Яркий фиолетовый */
            --text-color: #ffffff;      /* Белый текст */
            --text-secondary: #aaaaaa;  /* Серый для выполненных задач */
            --border-radius: 10px;      /* Скругление из макета */
        }

        /* Настройка шрифтов и фона, как в Figma */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            user-select: none; /* Запрещаем выделение текста, чтобы чувствовалось как приложение */
        }

        /* Заголовок "To-Do List" */
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 25px;
            text-align: left;
        }

        /* Блок ввода новой задачи */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            flex-grow: 1;
            background-color: var(--card-bg);
            border: 2px solid #3d3d3d; /* Неявная граница */
            border-radius: var(--border-radius);
            padding: 14px;
            font-size: 16px;
            color: var(--text-color);
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color); /* При фокусе фиолетовая обводка */
        }

        /* Фиолетовая кнопка Плюс "+" */
        .add-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            width: 50px;
            height: 50px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Список задач */
        #todo-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        /* Элемент списка */
        .todo-item {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .todo-item:active {
            background-color: #3d3d3d; /* Эффект нажатия */
        }

        /* Текст задачи */
        .todo-text {
            font-size: 16px;
            flex-grow: 1;
            word-wrap: break-word;
        }

        /* Кастомный чекбокс (фиолетовый круг) */
        .checkbox-custom {
            width: 22px;
            height: 22px;
            border: 2px solid var(--accent-color);
            border-radius: 50%; /* Круглый */
            position: relative;
            flex-shrink: 0;
        }

        /* Стиль для выполненной задачи */
        .todo-item.completed .todo-text {
            color: var(--text-secondary);
            text-decoration: line-through; /* Зачеркивание */
        }

        .todo-item.completed .checkbox-custom {
            background-color: var(--accent-color); /* Закрашенный */
        }

        .todo-item.completed .checkbox-custom::after {
            content: '✓'; /* Белая галочка */
            color: white;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
        }

        /* Кнопка удаления (крестик) */
        .delete-btn {
            background: none;
            border: none;
            color: #ff4d4d; /* Красный крестик */
            font-size: 20px;
            cursor: pointer;
            padding: 0;
            display: none; /* Скрыт по умолчанию, появляется у выполненных */
        }

        .todo-item.completed .delete-btn {
            display: block;
        }

    </style>
</head>
<body>

    <h1>To-Do List</h1>

    <div class="input-group">
        <input type="text" id="todo-input" placeholder="Add a new task...">
        <button class="add-btn" id="add-btn">+</button>
    </div>

    <ul id="todo-list">
        <!-- Сюда будут добавляться задачи через JavaScript -->
    </ul>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Расширяем на все окно

        const input = document.getElementById('todo-input');
        const addBtn = document.getElementById('add-btn');
        const list = document.getElementById('todo-list');

        // Функция добавления задачи
        function addTask() {
            const text = input.value.trim();
            if (text === "") return; // Пустые не добавляем

            const li = document.createElement('li');
            li.className = 'todo-item';
            
            li.innerHTML = `
                <div class="checkbox-custom"></div>
                <span class="todo-text">${text}</span>
                <button class="delete-btn">×</button>
            `;

            // Обработка клика по задаче (переключение выполнено/нет)
            li.addEventListener('click', function(e) {
                // Если кликнули не на кнопку удаления, переключаем статус
                if (!e.target.classList.contains('delete-btn')) {
                    li.classList.toggle('completed');
                }
            });

            // Обработка удаления задачи
            const deleteBtn = li.querySelector('.delete-btn');
            deleteBtn.addEventListener('click', function(e) {
                e.stopPropagation(); // Останавливаем всплытие клика (чтобы не сработал completed)
                li.remove();
            });

            list.appendChild(li);
            input.value = ""; // Очищаем поле ввода
        }

        // Добавление по кнопке
        addBtn.addEventListener('click', addTask);

        // Добавление по нажатию Enter
        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });
    </script>
</body>
</html>
