<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ham Smoke Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        h2 { text-align: center; margin-bottom: 20px; }
        .product-card {
            background-color: var(--tg-theme-secondary-bg-color, #212d3b);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .product-info h3 { margin: 0 0 5px 0; font-size: 16px; }
        .product-info p { margin: 0; color: var(--tg-theme-hint-color, #7f8c8d); font-size: 14px; }
        .btn-add {
            background-color: var(--tg-theme-button-color, #248bca);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>🛒 Каталог товаров</h2>

    <div class="product-card">
        <div class="product-info">
            <h3>Товар 1</h3>
            <p>1000 ₽</p>
        </div>
        <button class="btn-add" onclick="addToCart('Товар 1', 1000)">Добавить</button>
    </div>

    <div class="product-card">
        <div class="product-info">
            <h3>Товар 2</h3>
            <p>1500 ₽</p>
        </div>
        <button class="btn-add" onclick="addToCart('Товар 2', 1500)">Добавить</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let cart = [];

        function addToCart(title, price) {
            cart.push({ title, price });
            tg.MainButton.setText(`Оформить заказ (${cart.reduce((a, b) => a + b.price, 0)} ₽)`);
            tg.MainButton.show();
        }

        Telegram.WebApp.onEvent('mainButtonClicked', function() {
            tg.sendData(JSON.stringify(cart));
        });
    </script>
</body>
</html>
